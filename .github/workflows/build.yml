name: Build LINGUA apps

# Every push: run the tests and build both apps (downloadable from the run's Artifacts, for testing).
# A public release is published ONLY when you ask for it: push a version tag (v1.2.0), put "[release]" in the
# commit message, or run this workflow by hand with "release" ticked. The version comes from lingua/__init__.py.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: |
          python -m pip install --upgrade pip
          pip install numpy==2.5.5 pytest==9.1.1
          python -m pytest -q tests

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: LINGUA-Windows.zip
          - os: macos-latest
            asset: LINGUA-Mac-AppleSilicon.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Icons
        run: python tools/make_icons.py

      - name: Build
        run: pyinstaller --noconfirm lingua.spec

      - name: Self-test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          LINGUA_SELFTEST_OUT: selftest.txt
        run: |
          $p = Start-Process -FilePath "dist\LINGUA\LINGUA.exe" -ArgumentList "--selftest","--full" -Wait -PassThru
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Self-test (Mac)
        if: runner.os == 'macOS'
        env:
          LINGUA_SELFTEST_OUT: selftest.txt
        run: |
          dist/LINGUA.app/Contents/MacOS/LINGUA --selftest --full || (cat selftest.txt; exit 1)
          cat selftest.txt

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item README.md dist\LINGUA\README.md
          Compress-Archive -Path dist\LINGUA -DestinationPath ${{ matrix.asset }}

      - name: Package (Mac)
        if: runner.os == 'macOS'
        run: |
          xattr -cr dist/LINGUA.app
          codesign --force --deep --sign - dist/LINGUA.app
          mkdir pkg && cp -R dist/LINGUA.app pkg/ && cp README.md pkg/
          ditto -c -k --keepParent pkg ${{ matrix.asset }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}
            selftest.txt

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[release]') || inputs.release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: v
        run: echo "tag=v$(python3 -c "import re;print(re.search(r'__version__ = \"([^\"]+)\"',open('lingua/__init__.py').read()).group(1))")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Publish download page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: LINGUA Desktop ${{ steps.v.outputs.tag }}
          make_latest: true
          body: |
            **Download for your computer, unzip, and open LINGUA.**
            - Windows 10/11: `LINGUA-Windows.zip` → open the folder → double-click `LINGUA.exe`
              (unsigned app: if SmartScreen appears, More info → Run anyway)
            - Mac with Apple Silicon (M1–M4): `LINGUA-Mac-AppleSilicon.zip` → drag LINGUA.app to Applications →
              right-click → Open (first time only). Intel Macs: use the Python version (README).
            Free extras for "Others hear me": VB-Cable (Windows) or BlackHole (Mac). See README.
          files: |
            out/**/LINGUA-*.zip
