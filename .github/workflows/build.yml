name: Build LINGUA apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: LINGUA-Windows.zip
          - os: macos-latest
            asset: LINGUA-Mac-AppleSilicon.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow

      - name: Icons
        run: python tools/make_icons.py

      - name: Build
        run: pyinstaller --noconfirm lingua.spec

      - name: Self-test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          LINGUA_SELFTEST_OUT: selftest.txt
        run: |
          $p = Start-Process -FilePath "dist\LINGUA\LINGUA.exe" -ArgumentList "--selftest","--full" -Wait -PassThru
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Self-test (Mac)
        if: runner.os == 'macOS'
        env:
          LINGUA_SELFTEST_OUT: selftest.txt
        run: |
          dist/LINGUA.app/Contents/MacOS/LINGUA --selftest --full || (cat selftest.txt; exit 1)
          cat selftest.txt

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item README.md dist\LINGUA\README.md
          Compress-Archive -Path dist\LINGUA -DestinationPath ${{ matrix.asset }}

      - name: Package (Mac)
        if: runner.os == 'macOS'
        run: |
          xattr -cr dist/LINGUA.app
          codesign --force --deep --sign - dist/LINGUA.app
          mkdir pkg && cp -R dist/LINGUA.app pkg/ && cp README.md pkg/
          ditto -c -k --keepParent pkg ${{ matrix.asset }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}
            selftest.txt

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Publish download page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: LINGUA Desktop (latest build)
          make_latest: true
          body: |
            **Download for your computer, unzip, and open LINGUA.**
            - Windows 10/11: `LINGUA-Windows.zip` → open the folder → double-click `LINGUA.exe`
              (if SmartScreen appears: More info → Run anyway)
            - Mac with Apple Silicon (M1–M4): `LINGUA-Mac-AppleSilicon.zip` → drag LINGUA.app to Applications →
              right-click → Open (first time only)
            Free extras for "Others hear me": VB-Cable (Windows) or BlackHole (Mac). See README.
          files: |
            out/**/LINGUA-*.zip
